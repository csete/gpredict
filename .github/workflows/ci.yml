name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool intltool autoconf automake libcurl4-openssl-dev \
            pkg-config libglib2.0-dev libgtk-3-dev autopoint

      - name: Run autoconf
        run: ./autogen.sh

      - name: Build
        run: make -j2

      - name: Run tests
        run: make check

      - name: Check distribution
        run: make -j2 distcheck

  # Cross-compile the Windows 64-bit build on a Linux runner using the
  # system mingw-w64 toolchain plus an MSYS2-repo dependency sysroot
  # (see doc/BUILDING-WINDOWS.md section 5).
  windows-cross:
    name: Windows 64-bit cross-build (Linux)
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-w64-mingw32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64 autoconf automake \
            libtool intltool autopoint gettext pkg-config python3 zstd zip \
            libglib2.0-dev-bin

      - name: Bootstrap MSYS2 cross sysroot
        run: python3 tools/msys2-sysroot.py "$GITHUB_WORKSPACE/sysroot"

      - name: Configure and build
        run: |
          autoreconf -fi
          ./configure --host=$TARGET --prefix=/mingw64 \
            PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/sysroot/mingw64/lib/pkgconfig"
          make -j2

      - name: Package standalone zip
        run: |
          sh tools/cross-package.sh . "$GITHUB_WORKSPACE/sysroot" \
            stage/gpredict-$TARGET
          (cd stage && zip -qr "../gpredict-$TARGET.zip" "gpredict-$TARGET")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpredict-windows-x86_64-cross
          path: gpredict-${{ env.TARGET }}.zip
